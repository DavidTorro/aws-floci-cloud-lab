<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">AWS Floci Cloud Lab</title>
  <desc id="description">Banner oscuro con una red de identidades conectadas, el nombre AWS Floci Cloud Lab y una tubería de despliegue que sube de Floci a GitHub Actions y a Amazon S3.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#091321"/>
      <stop offset="1" stop-color="#13243A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="pipeline" x1="952" y1="214" x2="1136" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(227 151) rotate(90) scale(174)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#115E59" stop-opacity=".34"/>
      <stop offset="1" stop-color="#115E59" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo-cloud" cx="0" cy="0" r="1" gradientTransform="translate(1044 151) rotate(90) scale(150)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B45309" stop-opacity=".18"/>
      <stop offset="1" stop-color="#B45309" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8DA4BA" stroke-opacity=".08"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#8DA4BA"/>
    </marker>
  </defs>

  <rect width="1200" height="300" fill="url(#background)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="5" fill="url(#accent)"/>
  <circle cx="227" cy="151" r="174" fill="url(#halo)"/>
  <circle cx="1044" cy="151" r="150" fill="url(#halo-cloud)"/>

  <!-- Parte 1: identidades y grupos -->
  <g fill="none" stroke="#5EEAD4" stroke-opacity=".46" stroke-width="2">
    <path d="M118 91 219 151 118 211"/>
    <path d="M219 151 339 151"/>
    <circle cx="219" cy="151" r="93" stroke-opacity=".18" stroke-dasharray="4 9"/>
  </g>

  <g fill="#0E2C38" stroke="#5EEAD4" stroke-width="2.5">
    <circle cx="118" cy="91" r="28"/>
    <circle cx="118" cy="211" r="28"/>
    <circle cx="339" cy="151" r="28"/>
  </g>
  <g fill="#5EEAD4">
    <circle cx="118" cy="84" r="7"/>
    <path d="M104 106c2-9 7-13 14-13s12 4 14 13"/>
    <circle cx="118" cy="204" r="7"/>
    <path d="M104 226c2-9 7-13 14-13s12 4 14 13"/>
    <circle cx="339" cy="144" r="7"/>
    <path d="M325 166c2-9 7-13 14-13s12 4 14 13"/>
  </g>

  <circle cx="219" cy="151" r="58" fill="#102C3B" stroke="#5EEAD4" stroke-width="3"/>
  <path d="M204 139v-12a15 15 0 0 1 30 0v12" fill="none" stroke="#FBBF24" stroke-width="5" stroke-linecap="round"/>
  <rect x="196" y="138" width="46" height="37" rx="7" fill="#FBBF24"/>
  <circle cx="219" cy="154" r="4" fill="#12243A"/>
  <path d="M219 156v8" stroke="#12243A" stroke-width="3" stroke-linecap="round"/>

  <text x="449" y="90" fill="#5EEAD4" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="4">NEXTGEN SOLUTIONS · TERRAFORM</text>
  <text x="444" y="164" fill="#F5F9FC" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="800" letter-spacing="1">AWS + FLOCI</text>
  <text x="448" y="213" fill="#5EEAD4" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" letter-spacing="5">CLOUD LAB</text>
  <text x="449" y="254" fill="#8DA4BA" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="3">IDENTIDADES IAM  ·  DESPLIEGUE CONTINUO</text>

  <!-- Parte 2: de local a la nube -->
  <g fill="none" stroke="url(#pipeline)" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round">
    <path d="M974 199 1020 167" marker-end="url(#arrow)"/>
    <path d="M1066 136 1112 104" marker-end="url(#arrow)"/>
  </g>

  <g stroke-width="2.5">
    <circle cx="952" cy="214" r="26" fill="#0E2C38" stroke="#5EEAD4"/>
    <circle cx="1044" cy="151" r="26" fill="#0E2C38" stroke="#5EEAD4"/>
    <circle cx="1136" cy="88" r="28" fill="#2A2412" stroke="#FBBF24"/>
  </g>

  <!-- Floci: el PC -->
  <rect x="940" y="203" width="24" height="16" rx="2" fill="none" stroke="#5EEAD4" stroke-width="2.5"/>
  <path d="M946 225h12M952 219v6" stroke="#5EEAD4" stroke-width="2.5" stroke-linecap="round"/>
  <!-- GitHub Actions: ejecutar -->
  <path d="M1038 140v22l18-11z" fill="#5EEAD4"/>
  <!-- Amazon S3: el bucket -->
  <ellipse cx="1136" cy="78" rx="13" ry="4.5" fill="none" stroke="#FBBF24" stroke-width="2.5"/>
  <path d="M1123 78l3.5 21c1 3.5 18 3.5 19 0l3.5-21" fill="none" stroke="#FBBF24" stroke-width="2.5" stroke-linejoin="round"/>

  <g font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2.5" text-anchor="middle">
    <text x="952" y="260" fill="#5EEAD4">FLOCI</text>
    <text x="1044" y="197" fill="#5EEAD4">ACTIONS</text>
    <text x="1136" y="136" fill="#FBBF24">AWS S3</text>
  </g>
</svg>
